# Collective survival only. Agents are immortal; every action is paid from the colony
# treasury and every payout goes back into it. Colonies that run dry or stall die and are
# replaced from the fittest survivor's genome and history.
system: colonies
survival: collective
swarm:
  models: [claude-haiku-5-5]
  n_agents: 4
  max_agents: 4
  diversity_first: true
  min_families: 3
  critics_enabled: true
  critiques_required: 1
  max_attempts: 3
  stagnation_ticks: 5
colony:
  n_colonies: 3
  selection: true
  max_rounds: 25
  initial_treasury: 24.0
  found_threshold: 48.0
  found_cost: 24.0
  max_foundings: 6
  max_colonies: 4
  genome_noise: 0.3
  stop_when_ready: 2
