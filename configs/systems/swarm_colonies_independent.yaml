# Control for the colony variants: same colonies and genome variation, individual survival
# inside each, but no colony-level selection (colonies never die, reproduce, or get replaced).
# Separates "selection between colonies" from "more parallel attempts".
system: colonies
survival: individual
swarm:
  models: [claude-haiku-5-5]
  n_agents: 4
  max_agents: 6
  max_respawns: 24
  diversity_first: true
  min_families: 3
  critics_enabled: true
  critiques_required: 1
  max_attempts: 3
  stagnation_ticks: 5
colony:
  n_colonies: 3
  selection: false
  max_rounds: 25
  genome_noise: 0.3
  stop_when_ready: 2
