# Individual + collective survival. Agents pay their own costs and die at zero energy; the
# colony taxes their earnings, pays for respawns and upkeep, and dies when its treasury runs
# out. Dead colonies are replaced from the fittest survivor.
system: colonies
survival: both
swarm:
  models: [claude-haiku-5-5]
  n_agents: 4
  max_agents: 6
  max_respawns: 24
  diversity_first: true
  min_families: 3
  critics_enabled: true
  critiques_required: 1
  max_attempts: 3
  stagnation_ticks: 5
colony:
  n_colonies: 3
  selection: true
  max_rounds: 25
  initial_treasury: 24.0
  tax: 0.3
  respawn_cost: 3.0
  upkeep: 0.1
  found_threshold: 48.0
  found_cost: 24.0
  max_foundings: 6
  max_colonies: 4
  genome_noise: 0.3
  stop_when_ready: 2
