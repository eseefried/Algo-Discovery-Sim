# Shared by every system. Keep budget identical across systems you compare.
budget:
  max_usd: 2.00          # dollar cap on model spend per run (judge excluded)
  max_tokens: null       # optional extra cap on input+output tokens
effort: medium           # output_config.effort for every agent call
sandbox:
  profile: auto          # auto | bwrap | none (auto prefers bwrap)
  timeout_s: 90
judge:
  models: [claude-opus-5-5, claude-sonnet-5-5]   # two independent rubric judges
  effort: high
  max_usd: 2.00
  recovered_threshold: 0.7     # method_match >= this -> method recovered
  alternative_threshold: 0.5   # claim reproduced and method_match < this -> valid alternative
