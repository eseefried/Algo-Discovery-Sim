[project]
name = "algo-discovery-sim"
version = "0.1.0"
description = "Single-agent quantum algorithm reconstruction and simulation baseline"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.17,<2",
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "python-dotenv>=1.0,<2",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "httpx2>=2.16,<3", "ruff>=0.12,<1"]
quantum = ["qiskit>=2.2,<3", "numpy>=2,<3"]
simulation = ["qiskit-aer>=0.18.2,<1"]

[project.scripts]
abstract-to-equations = "algo_discovery.cli:main"
equations-to-qiskit = "algo_discovery.code_cli:main"
validate-qiskit = "algo_discovery.validate_cli:main"
simulate-qiskit = "algo_discovery.simulation_cli:main"
run-pipeline = "algo_discovery.pipeline_cli:main"
run-code-sim = "algo_discovery.code_sim_cli:main"
evaluate-baseline = "algo_discovery.math_score:main"
run-swarm = "algo_discovery.swarm.cli:main"
swarm-ledger = "algo_discovery.swarm.cli:ledger_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/algo_discovery"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.uv]
default-groups = ["dev", "quantum", "simulation"]
