[project]
name = "abstract2method"
version = "0.1.0"
description = "Agent swarm that rebuilds quantum algorithms from paper abstracts and verifies them in simulation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.17,<2",
    "numpy>=1.26",
    "pydantic>=2.10,<3",
    "python-dotenv>=1.0,<2",
    "pyyaml>=6",
    "qiskit>=2.0,<3",
    "qiskit-aer>=0.17",
    "rdkit>=2024.9",
    "scipy>=1.13",
    "selfies>=2.1",
    "ViennaRNA>=2.6",
]

[project.optional-dependencies]
# NVIDIA ALCHEMI Toolkit: GPU-first (Warp also runs on CPU) atomistic backend. Pulls in PyTorch.
alchemi = ["nvalchemi-toolkit>=0.2,<0.3"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "httpx2>=2.16,<3"]

[project.scripts]
a2m = "a2m.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/a2m"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
