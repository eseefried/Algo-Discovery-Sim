[project]
name = "algo-discovery-sim"
version = "0.1.0"
description = "Abstract-to-equation single-agent quantum reconstruction baseline"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.17,<2",
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "python-dotenv>=1.0,<2",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "httpx2>=2.16,<3", "ruff>=0.12,<1"]

[project.scripts]
abstract-to-equations = "algo_discovery.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/algo_discovery"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
