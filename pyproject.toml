[project]
name = "algo-discovery-sim"
version = "0.2.0"
description = "Abstract-to-method reconstruction: single-agent baseline and multi-agent swarm benchmark"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.17,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "jsonschema>=4.23,<5",
    "numpy>=2,<3",
    "pydantic>=2.10,<3",
    "python-dotenv>=1.0,<2",
    "pyyaml>=6",
    "qiskit>=2.2,<3",
    "qiskit-aer>=0.18.2,<1",
    "rdkit>=2024.9",
    "scipy>=1.13",
    "selfies>=2.1",
    "uvicorn>=0.34,<1",
    "ViennaRNA>=2.6",
]

[project.optional-dependencies]
# NVIDIA ALCHEMI Toolkit: GPU-first atomistic backend, used as an independent recomputation
# of cluster energies in the materials domain. Pulls in PyTorch.
alchemi = ["nvalchemi-toolkit>=0.2,<0.3"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "httpx2>=2.16,<3", "ruff>=0.12,<1"]
quantum = ["qiskit>=2.2,<3", "numpy>=2,<3"]
simulation = ["qiskit-aer>=0.18.2,<1"]

[project.scripts]
# Single-agent baseline (src/algo_discovery)
abstract-to-equations = "algo_discovery.cli:main"
nemotron-equations = "algo_discovery.nemotron_equations:main"
run-native-swarm = "algo_discovery.native_swarm:main"
equations-to-qiskit = "algo_discovery.code_cli:main"
validate-qiskit = "algo_discovery.validate_cli:main"
simulate-qiskit = "algo_discovery.simulation_cli:main"
run-pipeline = "algo_discovery.pipeline_cli:main"
run-code-sim = "algo_discovery.code_sim_cli:main"
evaluate-baseline = "algo_discovery.math_score:main"
# Ledger swarm (src/algo_discovery/swarm)
run-swarm = "algo_discovery.swarm.cli:main"
swarm-ledger = "algo_discovery.swarm.cli:ledger_main"
a2m-spec = "algo_discovery.a2m_spec:main"
# Swarm benchmark (src/a2m)
a2m = "a2m.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/algo_discovery", "src/a2m"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.uv]
default-groups = ["dev", "quantum", "simulation"]
